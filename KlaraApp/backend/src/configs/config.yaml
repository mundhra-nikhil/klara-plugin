# GRSS Backend Configuration
# Environment-specific overrides are loaded from .env files

app:
  env: development
  host: 0.0.0.0
  port: 8000
  debug: false
  api_v1_prefix: /api/v1

database:
  pool_size: 20
  max_overflow: 10

redis:
  url: redis://localhost:6379/0

azure_openai:
  deployment: gpt-4
  api_version: "2024-02-15-preview"

azure_storage:
  container_prefix: grss-docs

cors:
  origins:
    - http://localhost:5173

pytest:
  database_url: postgresql+asyncpg://grss_user:changeme@localhost:5432/grss_test_db
  redis_url: redis://localhost:6379/1
